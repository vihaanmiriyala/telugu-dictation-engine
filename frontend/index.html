<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Dictation Engine</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1113;
            --bg-gradient: radial-gradient(circle at 50% -20%, #3a3d41 0%, #0f1113 80%);
            --glass-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-red: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .engine-card {
            background: var(--glass-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 4rem 2rem;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            border: 1px solid var(--glass-border);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
        }

        .status-indicator.is-recording {
            background: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3.5rem;
            background: linear-gradient(to bottom, #fff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* --- Mic Button --- */
        .mic-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 3rem;
        }

        .mic-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .mic-button:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.2);
        }

        .mic-button.active {
            background: var(--accent-red);
            border-color: transparent;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        /* --- Transcript & Stats --- */
        #transcript-box {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 2rem;
            min-height: 120px;
            margin-bottom: 2.5rem;
            border: 1px solid var(--glass-border);
            font-size: 1.4rem;
            line-height: 1.5;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Specifically apply Telugu font for the response area */
            font-family: 'Noto Sans Telugu', 'Inter', sans-serif;
        }

        .telemetry-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            text-align: left;
        }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
        }

        /* --- Footer --- */
        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .placeholder-text { 
            color: #4b5563; 
            font-style: italic; 
            font-size: 1rem; 
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Telugu Dictation Engine</div>
    </header>

    <main>
        <div class="engine-card">
            <div class="status-pill">
                <div id="statusDot" class="status-indicator"></div>
                <span id="statusLabel">SYSTEM READY</span>
            </div>

            <h1>Telugu Dictation</h1>

            <div class="mic-wrapper">
                <button id="recordBtn" class="mic-button">🎤</button>
            </div>

            <div id="transcript-box">
                <span class="placeholder-text">Click the microphone to start speaking...</span>
            </div>

            <div class="telemetry-row">
                <div class="stat-card">
                    <span class="stat-label">Latency</span>
                    <span id="latencyVal" class="stat-value">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Duration</span>
                    <span id="durationVal" class="stat-value">--</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        Copyright &copy; 2026 • Telugu Dictation Engine • All Rights Reserved
    </footer>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const recordBtn = document.getElementById('recordBtn');
        const transcriptBox = document.getElementById('transcript-box');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const latencyVal = document.getElementById('latencyVal');
        const durationVal = document.getElementById('durationVal');

        recordBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = processTranscription;

                mediaRecorder.start();
                
                // UI Visual State: Recording
                recordBtn.classList.add('active');
                recordBtn.innerText = "⏹";
                statusDot.classList.add('is-recording');
                statusLabel.innerText = "RECORDING...";
                transcriptBox.innerHTML = '<span style="color: #ef4444; font-family: Inter;">Listening...</span>';
            } catch (err) {
                alert("Microphone access denied or not found.");
            }
        };

        async function processTranscription() {
            // UI Visual State: Processing
            recordBtn.classList.remove('active');
            recordBtn.innerText = "🎤";
            statusDot.classList.remove('is-recording');
            statusLabel.innerText = "PROCESSING...";
            transcriptBox.innerHTML = "<span style='font-family: Inter;'>Generating Transcription...</span>";

            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('file', audioBlob, 'capture.wav');

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Result from backend (stub) will be in Telugu
                transcriptBox.innerText = data.transcript;
                latencyVal.innerText = data.telemetry.latency;
                durationVal.innerText = data.telemetry.duration;
                statusLabel.innerText = "SYSTEM READY";
            } catch (err) {
                statusLabel.innerText = "CONNECTION ERROR";
                transcriptBox.innerHTML = '<span style="color: #ef4444; font-family: Inter;">Failed to reach backend.</span>';
            }
        }
    </script>
</body>
</html>
