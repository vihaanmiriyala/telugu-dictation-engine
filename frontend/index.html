<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguDict AI | Advanced Dictation</title>
    <!-- Modern Sans-serif Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1c1e 0%, #2d3436 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #0984e3;
            --accent-red: #d63031;
            --text-main: #f5f6fa;
            --text-dim: #b2bec3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans Telugu', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 20px; font-size: 0.85rem; }
        .nav-links a { color: var(--text-dim); text-decoration: none; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }

        /* --- Main UI --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .ai-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #55efc4;
            border-radius: 50%;
            box-shadow: 0 0 10px #55efc4;
        }

        .status-dot.recording {
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 600; }
        .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 2.5rem; }

        /* --- Controls --- */
        .control-panel { position: relative; display: inline-block; }

        .mic-trigger {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--text-main);
            color: #000;
            font-size: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 0 rgba(255,255,255,0.2);
        }

        .mic-trigger:hover { transform: scale(1.05); }
        .mic-trigger.active {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 40px rgba(214, 48, 49, 0.4);
        }

        /* --- Transcript Display --- */
        #transcript {
            margin-top: 2.5rem;
            padding: 1.5rem;
            min-height: 80px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #fff;
            border: 1px solid var(--glass-border);
        }

        .telemetry-grid {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tel-item {
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tel-value { display: block; color: #fff; font-weight: 600; margin-top: 4px; }

        /* --- Footer --- */
        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid var(--glass-border);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">TELUGUDICT AI</div>
        <nav class="nav-links">
            <a href="#">Engine</a>
            <a href="#">Research</a>
            <a href="#">Github</a>
        </nav>
    </header>

    <main>
        <div class="ai-card">
            <div class="status-badge">
                <div id="dot" class="status-dot"></div>
                <span id="status-text">SYSTEM READY</span>
            </div>

            <h1>తెలుగు డిక్టేషన్</h1>
            <p class="subtitle">Next-gen Telugu speech recognition skeleton.</p>

            <div class="control-panel">
                <button id="micBtn" class="mic-trigger">🎤</button>
            </div>

            <div id="transcript">ప్రతిలేఖనం కోసం వేచి ఉంది...</div>

            <div class="telemetry-grid">
                <div class="tel-item">Latency <span id="lat-val" class="tel-value">--</span></div>
                <div class="tel-item">Duration <span id="dur-val" class="tel-value">--</span></div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2023 Vāṇi Labs • Build v0.1.0-skeleton • Made for Telugu AI
    </footer>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const micBtn = document.getElementById('micBtn');
        const transcriptDiv = document.getElementById('transcript');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('dot');
        const latVal = document.getElementById('lat-val');
        const durVal = document.getElementById('dur-val');

        micBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = uploadAudio;

            mediaRecorder.start();
            
            // UI Updates
            micBtn.classList.add('active');
            micBtn.innerText = "⏹";
            statusDot.classList.add('recording');
            statusText.innerText = "RECORDING AUDIO";
            transcriptDiv.innerText = "Listening...";
        };

        async function uploadAudio() {
            // UI Reset
            micBtn.classList.remove('active');
            micBtn.innerText = "🎤";
            statusDot.classList.remove('recording');
            statusText.innerText = "PROCESSING...";
            transcriptDiv.innerText = "Transcribing (AI Stub)...";

            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('file', audioBlob, 'mic_capture.wav');

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                transcriptDiv.innerText = data.transcript;
                latVal.innerText = data.telemetry.latency;
                durVal.innerText = data.telemetry.duration;
                statusText.innerText = "SYSTEM READY";
            } catch (err) {
                statusText.innerText = "ERROR CONNECTING";
                transcriptDiv.innerText = "Check if backend is running.";
            }
        }
    </script>
</body>
</html>
