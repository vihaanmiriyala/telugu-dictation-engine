<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>Telugu Dictation MVP</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fafafa; }
        .mic-container { border: 2px solid #ddd; display: inline-block; padding: 40px; border-radius: 20px; background: white; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; }
        .record-btn { background: #e74c3c; color: white; }
        .stop-btn { background: #2c3e50; color: white; }
        #transcript { margin-top: 30px; font-size: 24px; color: #2980b9; font-weight: bold; }
        #telemetry { margin-top: 15px; font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="mic-container">
        <h1>Telugu Dictation Engine</h1>
        <p>Week 1: Hello Dictation Skeleton</p>
        
        <button id="startBtn" class="record-btn">Start Recording</button>
        <button id="stopBtn" class="stop-btn" style="display:none;">Stop & Transcribe</button>
        
        <div id="transcript"></div>
        <div id="telemetry"></div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const transcriptDiv = document.getElementById('transcript');
        const telemetryDiv = document.getElementById('telemetry');

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
            mediaRecorder.onstop = uploadAudio;

            mediaRecorder.start();
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            transcriptDiv.innerText = "Listening...";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        };

        async function uploadAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('file', audioBlob, 'mic_capture.wav');

            transcriptDiv.innerText = "Transcribing (Stub)...";

            // Sending to backend
            const response = await fetch('http://localhost:8000/transcribe', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            // Display Transcript and Telemetry
            transcriptDiv.innerText = data.transcript;
            telemetryDiv.innerText = `Latency: ${data.telemetry.latency} | Est. Duration: ${data.telemetry.duration}`;
        }
    </script>
</body>
</html>
